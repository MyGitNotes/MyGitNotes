name: Merge and deploy main
on:
  push:
    branches: [core]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  # Workspaces that track Core carry this file too; only the product repository verifies and publishes the demo.
  # Every job carries the repository guard, and a skipped verification job skips `release` through `needs`.
  static:
    if: contains(fromJSON('["MyGitNotes/MyGitNotes","wayne930242/MyGitNotes"]'), github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      - run: pnpm check:vercel-sparse-paths --core
      - run: pnpm lint
  build:
    if: contains(fromJSON('["MyGitNotes/MyGitNotes","wayne930242/MyGitNotes"]'), github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      - run: pnpm build
  test:
    if: contains(fromJSON('["MyGitNotes/MyGitNotes","wayne930242/MyGitNotes"]'), github.repository)
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      # The three shards together run every test file once; vitest splits the sorted file list by --shard.
      # `pnpm test --shard` fails (pnpm rejects the unknown option); `pnpm run` forwards it to vitest.
      - run: pnpm run test --shard=${{ matrix.shard }}/3
  release:
    if: contains(fromJSON('["MyGitNotes/MyGitNotes","wayne930242/MyGitNotes"]'), github.repository)
    needs: [static, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Only the repository that publishes the demo holds the deploy key; workspaces tracking Core skip the sync.
      HAS_CORE_SYNC_KEY: ${{ secrets.CORE_SYNC_SSH_KEY != '' }}
    steps:
      # A fresh checkout with no install: the sync requires a clean tree and needs only Node built-ins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.CORE_SYNC_SSH_KEY }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Skip demo synchronization
        if: env.HAS_CORE_SYNC_KEY != 'true'
        run: echo "::notice title=Demo sync skipped::CORE_SYNC_SSH_KEY is not set; this repository does not publish the demo workspace."
      - name: Synchronize examples
        if: env.HAS_CORE_SYNC_KEY == 'true'
        id: sync
        env:
          CORE_REVISION: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.event.repository.owner.id }}
        run: |
          git config user.name "$REPOSITORY_OWNER"
          git config user.email "$REPOSITORY_OWNER_ID+$REPOSITORY_OWNER@users.noreply.github.com"
          node scripts/sync-demo-main.mjs
      - name: Verify Vercel deployment
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.sync.outputs.deploy_sha }}
        run: node scripts/wait-vercel-status.mjs
